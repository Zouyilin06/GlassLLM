model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2
  d_ff: 1408
  max_seq_len: 512
  rope_theta: 10000.0
  norm_eps: 1.0e-6
  dropout: 0.0
  tie_embeddings: true

train:
  data_dir: "data/tinystories"
  tokenizer_path: "data/tinystories/tokenizer.json"
  out_dir: "checkpoints/base_30m"
  batch_size: 16
  grad_accum_steps: 4
  max_steps: 10000
  warmup_steps: 300
  eval_interval: 250
  eval_batches: 20
  log_interval: 25
  lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  bf16: true
  num_workers: 0
  seed: 42
  autosave_minutes: 5.0
