[project]
name = "glasslm"
version = "0.1.0"
description = "GlassLM: A modern small language model built from scratch in PyTorch with glass-box inspection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "tokenizers",
    "pyyaml",
    "numpy",
    "tqdm",
    "datasets",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasslm"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
